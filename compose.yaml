services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lockulture-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENV=development
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - STORAGE_TYPE=local
    volumes:
      - ./backend/src:/app/src
      - uploads_data:/app/uploads
    restart: unless-stopped

volumes:
  uploads_data:
